spring:
  application:
    name: product

  profiles:
    active: ${SPRING_PROFILES_ACTIVE:mock}

  # Configuracion WebFlux
  webflux:
    base-path: /

  # Datos de conexion (los perfiles prod/dev los sobreescriben o apuntan a variables de entorno)
  r2dbc:
    url: ${DATABASE_URL:r2dbc:postgresql://localhost:5432/postgres}
    username: ${DATABASE_USERNAME:postgres}
    password: ${DATABASE_PASSWORD:postgres}
    pool:
      initial-size: ${DB_POOL_INITIAL_SIZE:2}
      max-size: ${DB_POOL_MAX_SIZE:10}
      max-idle-time: 30m

server:
  port: ${SERVER_PORT:8086}

app:
  security:
    # Claim real del token Keycloak escrito por ms-organization (atributo "organizationId").
    organization-claim: ${ORGANIZATION_CLAIM:organizationId}
    # Contexto por defecto cuando se invoca sin JWT (seguridad deshabilitada).
    default-organization-id: ${DEFAULT_ORGANIZATION_ID:default}
    default-user-id: ${DEFAULT_USER_ID:system}

# Logging detallado
logging:
  level:
    root: INFO
    pe.edu.vallegrande.sigrc.product: DEBUG
    org.springframework.web: INFO
    org.springframework.r2dbc: WARN
    io.r2dbc.postgresql: WARN
    org.springframework.data.r2dbc: WARN
  pattern:
    console: "%d{yyyy-MM-dd HH:mm:ss} - %msg%n"
